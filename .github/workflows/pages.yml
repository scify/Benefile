# Publishes the landing page (site/) to GitHub Pages:
# https://scify.github.io/Benefile/
#
# It runs when site/ or this file changes on master, or by hand
# (Actions › Landing page › Run workflow). The source of the animated hero
# (site/hero/) and the README of site/ are not published, only the build
# of the hero in site/assets/hero/.

name: Landing page

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the published files
        run: rsync -a --exclude hero/ --exclude README.md site/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
